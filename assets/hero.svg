<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Hero</title>
<desc id="desc">Custom graphic for Karan, developer and creative thinker.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111920"/><stop offset="1" stop-color="#080D12"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#D6FF7F"/><stop offset="1" stop-color="#69DDCB"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#B8EE76" stop-opacity=".15"/><stop offset="1" stop-color="#B8EE76" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#97ABB6" stroke-opacity=".055"/></pattern>
 
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'DejaVu Sans Mono',monospace}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 36s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style>
<rect width="1200" height="540" rx="22" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="539" rx="22" fill="none" stroke="#26343D"/>
<rect width="1200" height="540" rx="22" fill="url(#grid)"/><circle cx="947" cy="277" r="260" fill="url(#glow)"/>
<g fill="none" stroke="#B8DAAA"><circle cx="947" cy="277" r="174" stroke-opacity=".13"/><circle cx="947" cy="277" r="139" stroke-opacity=".2"/><ellipse cx="947" cy="277" rx="174" ry="65" transform="rotate(-36 947 277)" stroke-opacity=".5"/><ellipse cx="947" cy="277" rx="174" ry="65" transform="rotate(36 947 277)" stroke-opacity=".25"/></g>
<g class="orbit"><circle cx="947" cy="277" r="174" fill="none" stroke="#D6FF7F" stroke-opacity=".65" stroke-dasharray="30 1064"/><circle cx="947" cy="103" r="6" fill="#D6FF7F"/></g>
<rect x="881" y="211" width="132" height="132" rx="28" fill="#14201E" stroke="#D6FF7F" stroke-opacity=".35" transform="rotate(-8 947 277)"/>
<text x="947" y="296" font-size="62" fill="#D6FF7F" font-weight="700" class="" text-anchor="middle">K.</text><text x="54" y="58" font-size="16" fill="#C2D1D8" font-weight="500" class="mono" >K / IAMKSR05</text><circle cx="918" cy="52" r="4" fill="#D6FF7F" class="pulse"/><text x="934" y="57" font-size="12" fill="#B8C7CF" font-weight="400" class="mono" >ALWAYS IN THE MAKING</text><text x="54" y="131" font-size="14" fill="#D6FF7F" font-weight="500" class="mono" >DEVELOPER  /  CREATIVE THINKER</text><text x="45" y="264" font-size="142" fill="#F1F5EF" font-weight="800" class="" letter-spacing="-8">KARAN.</text><text x="54" y="326" font-size="31" fill="#DBE6E9" font-weight="500" class="" >Curiosity in. Real things out.</text><text x="55" y="371" font-size="19" fill="#99ACB6" font-weight="400" class="" >Backends, connected systems &amp; a creative edge.</text><path d="M54 423H1146" stroke="#2B383E"/><text x="54" y="474" font-size="16" fill="#D6FF7F" font-weight="700" class="mono" >BUILD.</text><text x="165" y="474" font-size="16" fill="#98ABB4" font-weight="500" class="mono" >BREAK.</text><text x="284" y="474" font-size="16" fill="#98ABB4" font-weight="500" class="mono" >LEARN.</text><text x="405" y="474" font-size="16" fill="#98ABB4" font-weight="500" class="mono" >REPEAT.</text><text x="1146" y="474" font-size="13" fill="#C3D0D5" font-weight="400" class="mono" text-anchor="end">DREAM → LEARN → INNOVATE</text>
</svg>